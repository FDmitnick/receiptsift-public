<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" /><title>Choose a new password | ReceiptSift</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=Outfit:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/auth.css?v=2" />
  </head>
  <body>
    <main class="auth-page">
      <section class="auth-story"><a class="wordmark" href="/"><span class="mark"><i></i><i></i></span>ReceiptSift</a><h1>A new key.<br />The same ledger.</h1><p>YOUR NEW PASSWORD IS HASHED WITH ARGON2ID. COMPLETING THE RESET SIGNS OUT EVERY EXISTING SESSION.</p></section>
      <section class="auth-panel">
        <form class="auth-box" id="resetForm">
          <a class="wordmark" href="/"><span class="mark"><i></i><i></i></span>ReceiptSift PDF</a>
          <h2>Choose a new password.</h2><p>Use at least 12 characters and do not reuse a password from another service.</p>
          <label for="password">NEW PASSWORD · 12+ CHARACTERS</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required autofocus />
          <label for="confirmPassword">CONFIRM NEW PASSWORD</label><input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" minlength="12" maxlength="128" required />
          <button class="primary-action" id="resetButton" type="submit">Update password</button>
          <p class="auth-error" id="resetStatus" role="alert"></p>
          <div class="auth-links"><a href="/">← Public site</a><a href="/login">Back to sign in →</a></div>
        </form>
      </section>
    </main>
    <script src="/reset-password.js?v=2"></script>
  </body>
</html>
