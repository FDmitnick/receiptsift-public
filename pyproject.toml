[project]
name = "receiptsift-pdf"
version = "0.10.0"
description = "Protected PDF bill and receipt extraction with source-linked review."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --basetemp=.pytest-tmp"

[tool.ruff]
target-version = "py311"
line-length = 140

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
